<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive Lessons · DevOps + AWS</title>
<style>
  :root{
    --bg:#0e1117;--panel:#161b22;--panel-2:#1c232d;--border:#2a323d;
    --text:#e6edf3;--muted:#8b98a5;--dim:#5c6773;
    --accent:#ff9900;--accent-2:#4f8cff;--soft:rgba(255,153,0,.12);
    --ok:#3fb950;--ok-soft:rgba(63,185,80,.14);--danger:#f85149;--danger-soft:rgba(248,81,73,.12);
    --mono:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6;display:flex;flex-direction:column;height:100vh;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
  .topbar{height:56px;flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--border)}
  .back-link{color:var(--muted);text-decoration:none;font-size:20px;border:1px solid var(--border);background:var(--panel-2);border-radius:8px;width:34px;height:34px;display:flex;align-items:center;justify-content:center}
  .back-link:hover{border-color:var(--accent);color:var(--text)}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
  .steps-count{margin-left:auto;font-size:13px;color:var(--muted)}
  .score{font-size:13px;color:var(--accent);border:1px solid var(--border);background:var(--panel-2);padding:4px 10px;border-radius:99px}
  .live-btn{font-size:12px;color:var(--text);background:var(--panel-2);border:1px solid var(--border);padding:6px 11px;border-radius:8px;cursor:pointer;text-decoration:none}
  .live-btn:hover{border-color:var(--accent)}
  .progress-line{height:3px;background:var(--panel-2)}
  .progress-line > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .35s}
  .wrap{flex:1;overflow-y:auto;padding:30px 20px 120px}
  .col{max-width:760px;margin:0 auto}
  h1{font-size:26px;margin:0 0 6px}h2{font-size:20px;margin:0 0 14px}
  p{margin:12px 0}
  code{background:var(--panel-2);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-family:var(--mono);font-size:13px;color:#ffd9a0}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px 24px}
  .callout{background:var(--soft);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:12px 16px;margin:16px 0;font-size:14px}
  .tasktag{display:inline-flex;align-items:center;gap:7px;font-size:12px;text-transform:uppercase;letter-spacing:1px;padding:4px 10px;border-radius:99px;background:var(--panel-2);border:1px solid var(--border);color:var(--muted);margin-bottom:14px}
  .tasktag.concept{color:var(--accent-2)}.tasktag.quiz{color:#c586ff}.tasktag.term{color:var(--accent)}.tasktag.check{color:var(--ok)}
  .term{background:#0a0e13;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:14px}
  .term-bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#12171d;border-bottom:1px solid var(--border)}
  .term-bar i{width:11px;height:11px;border-radius:50%;display:inline-block}
  .term-bar .r{background:#ff5f56}.term-bar .y{background:#ffbd2e}.term-bar .g{background:#27c93f}
  .term-bar span{margin-left:8px;font-size:12px;color:var(--dim);font-family:var(--mono)}
  .term-body{padding:12px 14px;font-family:var(--mono);font-size:13px;line-height:1.55;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
  .term-out{color:#c9d4de}.term-err{color:#ff8a80}.term-cmd{color:#e6edf3}.term-cmd .ps{color:var(--accent)}
  .term-inputline{display:flex;align-items:center;font-family:var(--mono);font-size:13px;padding:6px 14px 12px}
  .term-inputline .ps{color:var(--accent);white-space:pre}
  .term-inputline input{flex:1;background:none;border:none;outline:none;color:#e6edf3;font-family:var(--mono);font-size:13px;margin-left:6px}
  .goal{font-size:13px;color:var(--muted);margin-top:10px}.goal.done{color:var(--ok)}
  .hintbtn{font-size:12px;color:var(--dim);background:none;border:none;cursor:pointer;text-decoration:underline;padding:0;margin-top:6px}
  .hint{font-size:13px;color:var(--accent);margin-top:6px;display:none}
  .opt{display:block;width:100%;text-align:left;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:8px 0;color:var(--text);cursor:pointer;font-size:14px;transition:.12s}
  .opt:hover{border-color:var(--accent)}.opt.correct{background:var(--ok-soft);border-color:var(--ok)}.opt.wrong{background:var(--danger-soft);border-color:var(--danger)}
  .opt.sel{border-color:var(--accent);background:var(--soft)}
  .dash{max-width:820px;margin:0 auto;padding:0 20px}
  .dash-bar{height:10px;background:var(--panel-2);border-radius:99px;overflow:hidden;margin:10px 0 4px}
  .dash-bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
  .dash-stats{display:flex;gap:18px;font-size:13px;color:var(--muted);flex-wrap:wrap}
  .dash-stats b{color:var(--text)}
  .reset-btn{font-size:12px;color:var(--dim);background:none;border:none;cursor:pointer;text-decoration:underline}
  .explain{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--panel-2);border:1px solid var(--border);font-size:14px;display:none}
  .explain.show{display:block}
  .cp-input{width:100%;min-height:76px;background:#0a0e13;border:1px solid var(--border);border-radius:8px;color:#e6edf3;font-family:var(--mono);font-size:13px;padding:10px;resize:vertical}
  .answer-input{background:#0a0e13;border:1px solid var(--border);border-radius:8px;color:#e6edf3;font-family:var(--mono);font-size:14px;padding:9px 12px;width:220px}
  .cp-feedback{margin-top:10px;font-size:14px;display:none}.cp-feedback.ok{display:block;color:var(--ok)}.cp-feedback.no{display:block;color:var(--danger)}
  .widgetbox{margin:6px 0;padding:18px;background:var(--panel);border:1px solid var(--border);border-radius:12px}
  .wtitle{font-size:13px;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
  .wrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .wrow label{font-size:13px;color:var(--muted)}
  .wrow input,.wrow select{background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 9px;font-family:var(--mono);font-size:14px}
  .wtable{width:100%;border-collapse:collapse;font-size:13px;font-family:var(--mono);margin-top:8px}
  .wtable th,.wtable td{border:1px solid var(--border);padding:6px 9px;text-align:left}
  .wtable th{background:var(--panel-2);color:var(--muted);font-family:var(--sans);font-size:12px}
  .wbar{height:24px;border-radius:5px;display:flex;overflow:hidden;margin-top:6px;border:1px solid var(--border)}
  .wbar > span{display:flex;align-items:center;justify-content:center;font-size:11px;color:#04140a;font-weight:600}
  .nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--border);padding:12px 20px;display:flex;gap:12px;align-items:center;justify-content:center}
  .btn{font-family:var(--sans);font-size:14px;padding:10px 22px;border-radius:9px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);cursor:pointer}
  .btn:hover:not(:disabled){border-color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1204;font-weight:600}
  .btn:disabled{opacity:.4;cursor:not-allowed}.btn.ghost{background:none}
  .locked-note{font-size:13px;color:var(--dim)}
  .done-screen{text-align:center;padding:40px 0}.done-screen .big{font-size:46px}
  /* menu */
  .menu-head{padding:34px 20px 10px;text-align:center}
  .menu-head .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent);margin-right:8px}
  .menu-grid{max-width:820px;margin:0 auto;padding:10px 20px 60px}
  .phase-title{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--dim);margin:26px 0 10px}
  .lesson-card{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin:10px 0;cursor:pointer;text-decoration:none;color:var(--text);transition:.15s}
  .lesson-card:hover{border-color:var(--accent);transform:translateX(2px)}
  .lesson-card .ic{width:40px;height:40px;border-radius:10px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:16px;flex:0 0 auto}
  .lesson-card .t{font-weight:600}.lesson-card .d{font-size:13px;color:var(--muted)}
  .lesson-card .chev{margin-left:auto;color:var(--dim)}
  .lesson-card.done-card .ic{background:var(--ok-soft);color:var(--ok)}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
  @media(max-width:600px){.wrap{padding:20px 14px 130px}.card{padding:18px}}
</style>
</head>
<body>
  <div id="app"></div>

<script src="sim-shell.js"></script>
<script src="sim-aws.js"></script>
<script src="sim-docker.js"></script>
<script src="sim-terraform.js"></script>
<script src="sim-k8s.js"></script>
<script src="lessons.js"></script>
<script src="player.js"></script>
<script>
const LS='devops-interactive-progress';
function completed(){ try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return {}} }
function markComplete(id){ const c=completed(); c[id]=true; localStorage.setItem(LS,JSON.stringify(c)); }

const desc={
  'linux-permissions':'chmod, ls -l, octal — in a real shell',
  'linux-cli':'navigate, create, redirect output',
  'git-basics':'init, commit, branch',
  'networking-cidr':'subnets, CIDR, security groups',
  'aws-iam-cli':'users, roles, least-privilege policies',
  'aws-s3':'buckets, objects, presigned URLs',
  'aws-vpc':'VPC, subnets, gateways, instances',
  'aws-lambda':'functions and event-driven triggers',
  'docker-basics':'build, run, ps, stop images',
  'docker-images':'small, non-root, tagged images',
  'terraform-basics':'init, plan, apply, destroy',
  'terraform-state':'remote state, locking, modules',
  'cicd-pipeline':'build, test, deploy on push',
  'kubernetes-basics':'deployments, pods, scaling, services',
  'eks':'managed Kubernetes on AWS + IRSA',
  'observability':'metrics, logs, traces, SLOs, incidents',
  'capstone-review':'tie it all together + final exam'
};
const icons={'linux-permissions':'$_','linux-cli':'>_','git-basics':'⎇','networking-cidr':'</>','aws-iam-cli':'IAM','aws-s3':'S3','aws-vpc':'VPC','aws-lambda':'ƛ','docker-basics':'🐳','docker-images':'📦','terraform-basics':'TF','terraform-state':'TF','cicd-pipeline':'CI','kubernetes-basics':'K8s','eks':'EKS','observability':'📊','capstone-review':'★'};

function renderMenu(){
  const c=completed();
  const allIds=LESSON_ORDER.flatMap(g=>g.ids);
  const doneCount=allIds.filter(id=>c[id]).length;
  const pct=Math.round(doneCount/allIds.length*100);
  let html=`<div class="menu-head"><h1><span class="dot"></span>Interactive lessons</h1>
    <p style="color:var(--muted)">Learn by doing — real commands in a mock environment. <a class="live-btn" href="index.html" style="display:inline-block;margin-left:6px">← reading course</a></p></div>
    <div class="dash">
      <div class="dash-bar"><i style="width:${pct}%"></i></div>
      <div class="dash-stats"><span><b>${doneCount}</b> / ${allIds.length} lessons complete</span><span><b>${pct}%</b></span>
      ${doneCount?'<button class="reset-btn" id="resetp">reset progress</button>':''}</div>
    </div>
    <div class="menu-grid">`;
  LESSON_ORDER.forEach(group=>{
    html+=`<div class="phase-title">${group.phase}</div>`;
    group.ids.forEach(id=>{
      const L=LESSONS[id]; if(!L) return;
      html+=`<a class="lesson-card ${c[id]?'done-card':''}" href="#${id}">
        <div class="ic">${c[id]?'✓':(icons[id]||'•')}</div>
        <div><div class="t">${L.name}</div><div class="d">${desc[id]||''}</div></div>
        <div class="chev">${c[id]?'done':'›'}</div></a>`;
    });
  });
  html+=`</div>`;
  const app=document.getElementById('app');
  app.innerHTML=html; app.style.display='block'; app.style.height='auto'; app.style.overflow='visible';
  const rb=document.getElementById('resetp');
  if(rb) rb.onclick=()=>{ if(confirm('Reset all lesson progress?')){ localStorage.removeItem(LS); renderMenu(); } };
}

function route(){
  const id=(location.hash||'').replace('#','');
  const app=document.getElementById('app');
  app.style.display='flex'; app.style.height='100vh'; app.style.overflow='hidden';
  if(id && LESSONS[id]){
    startLesson(LESSONS[id], ()=>markComplete(id));
  } else {
    renderMenu();
  }
}
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
